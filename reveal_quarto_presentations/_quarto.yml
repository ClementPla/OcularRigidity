project:
  type: website
  output-dir: _site
  # Only the website pages are part of this project — the revealjs decks
  # (SANS_meca_predictors_REPORT.qmd, firstPresentation.qmd) are rendered
  # on their own and are deliberately left out.
  render:
    - index.qmd
    - svd-basics.qmd
    - svd-temporal-signals.qmd
    - svd-simple-simulation.qmd
    - svd-simple-simulation-two-gaussians.qmd
    - sim-noise-in-dataset.qmd
    - sim-one-feature.qmd
    - sim-mixtures.qmd
    - mixtures/*.qmd
    - data-pulse-extraction-methods.qmd
    - comparing-one-cycle-videos.qmd
    - one_cycles/*.qmd
    - explore-iceemdan-svd.qmd
  # Les <video> sont ecrites en HTML brut dans les fragments generes : le
  # detecteur de ressources de Quarto ne suit pas ces balises (il suit <img>,
  # <link>, <script>), et le glob `resources` ci-dessous ne les rattrape pas non
  # plus -- tous les `figures_*/` sont des JONCTIONS vers E:, que le parcours
  # d'arbre resolvant ces globs ne traverse pas. Les .png du meme dossier
  # arrivent bien dans _site : eux passent par la syntaxe markdown, donc par le
  # detecteur, chemin par chemin. Les .mp4 sont donc copies apres coup par
  # `post-render`. Les entrees `resources` sont gardees comme declaration
  # d'intention (elles ne coutent rien) mais ne suffisent pas.
  resources:
    - figures_deux_gaussiennes_svd/*.mp4
    - figures_one_cycle_compare/videos/*.mp4
  post-render:
    - copy_video_resources.py

